# ============================================================
#  settings.toml — настройки парсера ЕИС
#
#  Любой параметр можно переопределить при запуске, например:
#    python main.py --local -k "картридж" -k "тонер" --pages 3
#  Все параметры запуска: python main.py --help
#
#  Строки — в кавычках, списки — в квадратных скобках через запятую.
#  Строка, начинающаяся с #, — комментарий. Сохранять в UTF-8.
# ============================================================

# Куда складывать документы:
#   "drive" — скачать и загрузить на Google Диск
#   "local" — оставить только на этом компьютере (в папке docs_dir)
# При запуске переключается флагами --drive / --local
target = "drive"

# --- Что искать ---

keywords = [
    "поставка офисной бумаги",
    "поставка бумаги для принтера",
    "поставка бумаги а4",
]

laws = ["44"]                # "44" и/или "223"
max_pages = 5                # сколько страниц результатов обходить на каждое слово
records_per_page = 50        # 10 / 20 / 50
sort_by = "UPDATE_DATE"      # PUBLISH_DATE / UPDATE_DATE / PRICE

# --- Скачивание ---

download_limit = 50          # макс. закупок на скачивание за один запуск
docs_dir = "docs"            # куда браузер качает файлы (относительно папки парсера или полный путь)
headless = true              # false — показывать окно браузера

# --- Google Диск (для target = "drive") ---

drive_folder = "Panoptis — тендеры 44-ФЗ"  # папка в «Моём диске», создаётся сама
keep_local_copy = true       # false — удалять файлы с компьютера после загрузки на Диск
credentials_file = "credentials.json"     # OAuth-клиент из Google Cloud (см. README)
token_file = "token.json"                 # появится после первого входа в Google
